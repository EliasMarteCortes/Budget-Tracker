{% block content %}

<h1>Are you sure?</h1>
<p>You are about to delete: <strong>{{ object }}</strong></p>

    <button type="submit">Yes, Delete</button>
    <a href="javascript:history.back()">Cancel</a>
</form>

{% endblock %}
